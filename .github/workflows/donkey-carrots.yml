name: Refresh donkey carrot animation
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/generate_donkey.py', '.github/workflows/donkey-carrots.yml']
permissions:
  contents: write
concurrency:
  group: donkey-carrots
  cancel-in-progress: false
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate animation from the public contribution calendar
        run: python scripts/generate_donkey.py
      - name: Save refreshed animation
        run: |
          if git diff --quiet -- assets/donkey-heatmap.svg; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/donkey-heatmap.svg
          git commit -m 'Refresh donkey contribution animation'
          git push
