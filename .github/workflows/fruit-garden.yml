name: Refresh fruit garden
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/generate_garden.py', '.github/workflows/fruit-garden.yml']
permissions:
  contents: write
concurrency:
  group: fruit-garden
  cancel-in-progress: false
jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Grow the garden from the public contribution calendar
        run: python scripts/generate_garden.py
      - name: Commit refreshed artwork
        run: |
          if git diff --quiet -- assets; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/carrot-rain.svg assets/fruit-garden.svg
          git commit -m 'Refresh the contribution orchard'
          git push
